name: Actual shared script get_docs consumer checks
on:
  push:
    branches: [codex/preflight-3999-script-consumer-final]
permissions:
  contents: read
jobs:
  remaining:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {"sha": "62749a4acb6c56c6d8d8566f4e3cd517b7173d68", "case": {"name": "external-with_script", "target": "test-check-packages-other", "group": "other", "package": "with_script", "independent": "true"}}
          - {"sha": "dec01743b4400a91258ade2c960a717ac40ffbe3", "case": {"name": "external-with_script", "target": "test-check-packages-other", "group": "other", "package": "with_script", "independent": "true"}}
    name: ${{ matrix.case.name }} (${{ matrix.sha }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: elastic/elastic-package
      - uses: actions/setup-go@v5
        with:
          go-version-file: elastic/elastic-package/.go-version
          cache-dependency-path: elastic/elastic-package/go.sum
      - name: Install upstream test tool versions on disposable runner
        run: |
          sudo sysctl -w vm.max_map_count=262144
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo install /tmp/yq /usr/local/bin/yq
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install kind and kubectl where upstream requires them
        if: matrix.case.group == 'with-kind' || matrix.case.target == 'test-system-test-flags'
        run: |
          curl -fsSL -o /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          sudo install /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client
      - name: Build exact tested contribution
        working-directory: elastic/elastic-package
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          make install
          go version
          docker compose version
      - name: Run upstream test command
        working-directory: elastic/elastic-package
        env:
          PACKAGE_UNDER_TEST: ${{ matrix.case.package }}
          PACKAGE_TEST_TYPE: ${{ matrix.case.group }}
          ELASTIC_PACKAGE_TEST_ENABLE_INDEPENDENT_AGENT: ${{ matrix.case.independent }}
          ELASTIC_PACKAGE_COMPOSE_DISABLE_VERBOSE_OUTPUT: 'true'
          ELASTIC_PACKAGE_MAXIMUM_NUMBER_PARALLEL_TESTS: '3'
          DEFAULT_VERSION_TAG: ${{ matrix.case.target == 'test-check-update-version' && 'v0.80.0' || '' }}
          K8S_VERSION: v1.36.1
        run: |
          make ${{ matrix.case.target }}
          make check-git-clean
      - name: Archive unchanged test evidence including literal wildcard directory names
        if: always()
        working-directory: elastic/elastic-package
        run: |
          python3 - <<'PYTHON'
          import glob, os, tarfile
          with tarfile.open(os.environ['RUNNER_TEMP'] + '/test-evidence.tgz', 'w:gz') as out:
              for path in glob.glob('build/test-results*') + glob.glob('build/elastic-stack-dump'):
                  out.add(path)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-${{ matrix.case.name }}-${{ matrix.sha }}
          path: ${{ runner.temp }}/test-evidence.tgz
